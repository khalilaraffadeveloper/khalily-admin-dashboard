<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAVA - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --k-blue: #0B1849;
            --k-blue-light: #1A2D6D;
            --k-gold: #D4A843;
            --k-gold-light: #E8C76A;
            --k-purple: #6A1B9A;
            --k-purple-light: #9C27B0;
            --k-red: #C62828;
            --k-white: #FFFFFF;
            --k-black: #121212;
            --k-bg: #F0F0F5;
        }

        * { font-family: 'Cairo', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--k-blue);
            margin: 0;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--k-white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-header {
            background: var(--k-blue);
            padding: 40px 32px 32px;
            text-align: center;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--k-white);
            border-radius: 50% 50% 0 0;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            border: 4px solid var(--k-gold);
            object-fit: cover;
            margin-bottom: 12px;
        }

        .login-header h1 {
            color: var(--k-white);
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }

        .login-header p {
            color: var(--k-gold-light);
            font-size: 14px;
            margin: 4px 0 0;
        }

        .login-body {
            padding: 36px 32px 32px;
        }

        .login-body .form-label {
            font-weight: 700;
            font-size: 13px;
            color: #555;
        }

        .login-body .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #E0E0E0;
            transition: border-color 0.2s;
        }

        .login-body .form-control:focus {
            border-color: var(--k-gold);
            box-shadow: 0 0 0 3px rgba(212,168,67,0.2);
        }

        .login-body .form-control-lg {
            padding: 14px 16px;
        }

        .btn-login {
            background: var(--k-blue);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s;
            color: var(--k-white);
        }

        .btn-login:hover {
            background: var(--k-blue-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(11,24,73,0.4);
            color: var(--k-gold-light);
        }

        .login-error {
            color: var(--k-red);
            font-size: 13px;
            font-weight: 600;
            min-height: 24px;
            margin-top: 8px;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-top: 24px;
        }

        .input-group-text {
            border-radius: 0 12px 12px 0;
            border: 2px solid #E0E0E0;
            border-right: none;
            background: var(--k-bg);
            color: var(--k-blue);
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
            border-left: none;
        }

        .input-group .form-control:focus ~ .input-group-text,
        .input-group .form-control:focus + .input-group-text {
            border-color: var(--k-gold);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="img/arava.png" alt="ARAVA" class="login-logo">
                <h1>ARAVA</h1>
                <p>لوحة تحكم الإدارة</p>
            </div>
            <div class="login-body">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <div class="input-group">
                        <input type="text" class="form-control form-control-lg" id="loginUser" placeholder="أدخل اسم المستخدم" autocomplete="username">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="loginPass" placeholder="أدخل كلمة المرور" autocomplete="current-password">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    </div>
                </div>
                <div class="login-error" id="loginError"></div>
                <button class="btn btn-login mt-2" id="loginBtn">
                    <i class="bi bi-box-arrow-in-left me-2"></i>تسجيل الدخول
                </button>
            </div>
        </div>
        <p class="login-footer">ARAVA © 2026 — نظام إدارة رحلات النقل </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="js/login.js?v=20260731"></script>
</body>
</html>

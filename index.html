<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khalily - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-page">
        <div class="login-card">
            <img src="img/khalily-logo.png" alt="Khalily" class="login-logo-img">
            <h1 class="login-title">Khalily</h1>
            <p class="login-subtitle">لوحة تحكم الإدارة</p>
            <div class="login-form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم" autocomplete="username">
            </div>
            <div class="login-form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPass" placeholder="أدخل كلمة المرور" autocomplete="current-password">
            </div>
            <div class="login-error" id="loginError"></div>
            <button class="login-btn" id="loginBtn">تسجيل الدخول</button>
        </div>
        <p class="login-footer">Khalily © 2026 — نظام إدارة رحلات الدراجات النارية</p>
    </div>
    <script src="js/login.js"></script>
</body>
</html>

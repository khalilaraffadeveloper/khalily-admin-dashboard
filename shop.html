<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARAVA - المتجر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f5f5f5; }
        .prod-card { border: none; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; background: white; }
        .prod-card:hover { transform: translateY(-2px); }
        .prod-img { width: 100%; height: 180px; object-fit: cover; }
        .prod-thumbs { display: flex; gap: 4px; padding: 0 12px 8px; overflow-x: auto; }
        .prod-thumbs img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer; border: 2px solid transparent; }
        .prod-thumbs img.active { border-color: #D4A843; }
        .type-badge { position: absolute; top: 10px; right: 10px; }
        .price-tag { color: #D4A843; font-weight: 800; font-size: 20px; }
        .btn-call { background: #2E7D32; border-color: #2E7D32; }
        .btn-whatsapp { background: #25D366; border-color: #25D366; }
        .btn-video { background: #FF0000; border-color: #FF0000; }
        .header-section { background: linear-gradient(135deg, #0B1849, #1a2a6c); color: white; padding: 20px; text-align: center; }
        .header-logo { width: 60px; height: 60px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .header-logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state i { font-size: 60px; margin-bottom: 15px; }
        .filter-bar { background: white; padding: 12px 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .filter-btn { border-radius: 20px; padding: 4px 16px; font-size: 13px; border: 1px solid #ddd; background: white; color: #555; }
        .filter-btn.active { background: #0B1849; color: white; border-color: #0B1849; }
        .gallery-modal img { width: 100%; max-height: 80vh; object-fit: contain; }
    .video-modal iframe { width: 100%; height: 56.25vw; max-height: 70vh; border: none; border-radius: 12px; }
    .video-thumb-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; background: #FF0000; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .video-thumb-btn:hover { background: #CC0000; color: #fff; }
    .video-thumb-btn i { font-size: 16px; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="header-logo">
            <img src="img/arava.png" alt="ARAVA">
        </div>
        <h5 class="fw-bold mb-0">ARAVA</h5>
        <small>المتجر — سيارات ودراجات ومنتجات</small>
    </div>

    <div class="filter-bar d-flex gap-2 overflow-auto">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="car">سيارات</button>
        <button class="filter-btn" data-filter="motorcycle">دراجات</button>
        <button class="filter-btn" data-filter="other">أخرى</button>
    </div>

    <div class="container py-3">
        <div id="productsContainer" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2 text-muted">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <!-- Image gallery modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 bg-transparent shadow-none">
                <div class="modal-body p-0 text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
                    <img id="galleryImage" class="gallery-modal img-fluid rounded-3" src="" alt="">
                </div>
            </div>
        </div>
    </div>

    <!-- Video embed modal -->
    <div class="modal fade video-modal" id="videoModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 bg-dark shadow-none">
                <div class="modal-body p-2 text-center position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 z-1" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                    <div id="videoPlayerContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var API_KEY = 'AIzaSyAkYQEb-aHo0Oft41tOAegVAyzH1fCmJWM';
            var PROJECT_ID = 'khalily-app';
            var BASE_URL = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents';

            var typeLabels = { car: 'سيارة', motorcycle: 'دراجة نارية', other: 'أخرى' };
            var typeIcons = { car: 'bi-car-front-fill', motorcycle: 'bi-bicycle', other: 'bi-box-seam' };
            var typeBadgeColors = { car: '#FF9800', motorcycle: '#2196F3', other: '#9C27B0' };
            var currentFilter = 'all';
            var allProducts = [];

            function openGallery(url) {
                document.getElementById('galleryImage').src = url;
                new bootstrap.Modal(document.getElementById('imageModal')).show();
            }

            function getYouTubeId(url) {
                if (!url) return null;
                var patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
                    /^([a-zA-Z0-9_-]{11})$/
                ];
                for (var i = 0; i < patterns.length; i++) {
                    var m = url.match(patterns[i]);
                    if (m) return m[1];
                }
                return null;
            }

            function playVideo(videoUrl) {
                var id = getYouTubeId(videoUrl);
                if (!id) { window.open(videoUrl, '_blank'); return; }
                var container = document.getElementById('videoPlayerContainer');
                container.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&controls=1&fs=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
                var modal = new bootstrap.Modal(document.getElementById('videoModal'));
                document.getElementById('videoModal').addEventListener('hidden.bs.modal', function () {
                    container.innerHTML = '';
                }, { once: true });
                modal.show();
            }

            function callPhone(phone) {
                if (!phone) return;
                window.open('tel:' + phone, '_system');
            }

            function openWhatsApp(phone, name) {
                if (!phone) return;
                var text = encodeURIComponent('مرحباً بخصوص ' + decodeURIComponent(name));
                window.open('whatsapp://send/?phone=' + phone + '&text=' + text, '_system');
            }

            function convertDoc(doc) {
                var fields = doc.fields || {};
                var data = { id: doc.name.split('/').pop() };
                for (var key in fields) {
                    var val = fields[key];
                    if (val.stringValue !== undefined) data[key] = val.stringValue;
                    else if (val.integerValue !== undefined) data[key] = parseInt(val.integerValue, 10);
                    else if (val.booleanValue !== undefined) data[key] = val.booleanValue;
                    else if (val.arrayValue) {
                        var arr = val.arrayValue.values || [];
                        data[key] = arr.map(function(v) { return v.stringValue || ''; });
                    } else if (val.timestampValue) {
                        data[key] = new Date(val.timestampValue).getTime();
                    }
                }
                return data;
            }

            function renderProducts(filter) {
                var container = document.getElementById('productsContainer');
                var filtered = filter === 'all' ? allProducts : allProducts.filter(function(p) { return p.type === filter; });
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="col-12"><div class="empty-state"><i class="bi bi-shop text-muted"></i><p>لا توجد منتجات في هذا القسم</p></div></div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < filtered.length; i++) {
                    var p = filtered[i];
                    var validImages = (p.images || []).filter(function(u) { return u && (u.startsWith('http') || u.startsWith('data:image')); });
                    var mainImg = validImages.length > 0 ? validImages[0] : null;
                    var thumbs = validImages.length > 1 ? validImages.slice(0, 4) : [];
                    var imgHtml = mainImg
                        ? '<img src="' + mainImg + '" class="prod-img" onclick="openGallery(\'' + mainImg.replace(/'/g, "\\'") + '\')" style="cursor:pointer;" onerror="this.style.display=\'none\'">'
                        : '<div style="height:180px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;"><i class="' + (typeIcons[p.type] || 'bi-box') + '" style="font-size:50px;color:#bbb;"></i></div>';
                    var thumbsHtml = '';
                    if (thumbs.length > 0) {
                        thumbsHtml = '<div class="prod-thumbs">';
                        for (var j = 0; j < validImages.length; j++) {
                            thumbsHtml += '<img src="' + validImages[j] + '" onclick="openGallery(\'' + validImages[j].replace(/'/g, "\\'") + '\')" alt="" onerror="this.style.display=\'none\'">';
                        }
                        thumbsHtml += '</div>';
                    }
                    var phoneClean = p.phone ? '222' + String(p.phone).replace(/^0+/, '') : '';
                    var videoHtml = p.videoUrl ? '<button class="video-thumb-btn" onclick="playVideo(\'' + p.videoUrl.replace(/'/g, "\\'") + '\')"><i class="bi bi-play-fill"></i> فيديو</button>' : '';
                    html += '<div class="col-md-4 col-sm-6">';
                    html += '<div class="prod-card position-relative">';
                    html += '<span class="type-badge badge" style="background:' + (typeBadgeColors[p.type] || '#6c757d') + ';color:white;"><i class="' + (typeIcons[p.type] || 'bi-box') + '"></i> ' + (typeLabels[p.type] || p.type) + '</span>';
                    html += imgHtml;
                    html += thumbsHtml;
                    html += '<div class="p-3 pt-2">';
                    html += '<h6 class="fw-bold mb-1">' + (p.name || '') + '</h6>';
                    html += '<p class="text-muted small mb-2" style="font-size:13px;">' + (p.description || '') + '</p>';
                    html += '<div class="price-tag mb-2">' + (p.price || 0) + ' <small>MRU</small></div>';
                    html += '<div class="d-flex gap-2">';
                    html += '<button onclick="callPhone(\'' + (p.phone || '') + '\')" class="btn btn-sm text-white btn-call flex-fill"><i class="bi bi-telephone-fill"></i> اتصال</button>';
                    html += '<button onclick="openWhatsApp(\'' + phoneClean + "','" + encodeURIComponent(p.name || '') + '\')" class="btn btn-sm text-white btn-whatsapp flex-fill"><i class="bi bi-whatsapp"></i> واتساب</button>';
                    html += videoHtml;
                    html += '</div></div></div></div>';
                }
                container.innerHTML = html;
            }

            function httpGet(url, callback) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try { callback(JSON.parse(xhr.responseText)); }
                            catch(e) { callback(null); }
                        } else {
                            callback(null);
                        }
                    }
                };
                xhr.onerror = function() { callback(null); };
                xhr.ontimeout = function() { callback(null); };
                xhr.timeout = 20000;
                xhr.send();
            }

            function loadProducts() {
                var container = document.getElementById('productsContainer');
                var url = BASE_URL + '/products?key=' + API_KEY;
                httpGet(url, function(data) {
                    if (!data || !data.documents) {
                        container.innerHTML = '<div class="col-12 text-center text-danger py-5">تعذر تحميل المنتجات. تحقق من الاتصال بالإنترنت.</div>';
                        return;
                    }
                    allProducts = [];
                    for (var i = 0; i < data.documents.length; i++) {
                        var prod = convertDoc(data.documents[i]);
                        if (prod.active === true) allProducts.push(prod);
                    }
                    allProducts.sort(function(a, b) {
                        var ta = typeof a.createdAt === 'number' ? a.createdAt : 0;
                        var tb = typeof b.createdAt === 'number' ? b.createdAt : 0;
                        return tb - ta;
                    });
                    renderProducts(currentFilter);
                });
            }

            var filterBtns = document.querySelectorAll('.filter-btn');
            for (var i = 0; i < filterBtns.length; i++) {
                filterBtns[i].addEventListener('click', function() {
                    var btns = document.querySelectorAll('.filter-btn');
                    for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderProducts(currentFilter);
                });
            }

            loadProducts();
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

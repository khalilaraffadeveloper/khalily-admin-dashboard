<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARAVA - العروض والنشاطات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f5f5f5; }
        .promo-card { border: none; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; background: white; }
        .promo-card:hover { transform: translateY(-2px); }
        .promo-img { width: 100%; height: 200px; object-fit: cover; }
        .type-badge { position: absolute; top: 10px; right: 10px; }
        .video-btn { background: #FF0000; color: white; border: none; border-radius: 8px; padding: 4px 12px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .video-btn:hover { background: #CC0000; color: white; }
        .header-section { background: linear-gradient(135deg, #0B1849, #1a2a6c); color: white; padding: 20px; text-align: center; }
        .header-logo { width: 60px; height: 60px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .header-logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state i { font-size: 60px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="header-logo">
            <img src="img/arava1.png" alt="ARAVA">
        </div>
        <h5 class="fw-bold mb-1">ARAVA</h5>
        <small>العروض والنشاطات</small>
    </div>

    <div class="container py-3">
        <div id="promotionsContainer" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2 text-muted">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkYQEb-aHo0Oft41tOAegVAyzH1fCmJWM",
            authDomain: "ARAVA-app.firebaseapp.com",
            projectId: "ARAVA-app",
            storageBucket: "ARAVA-app.firebasestorage.app",
            messagingSenderId: "384215858598",
            appId: "1:384215858598:web:c19bf6d475c567285aa367"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const typeLabels = { promotion: 'عرض', activity: 'نشاط', offer: 'تخفيض' };
        const typeColors = { promotion: '#0B1849', activity: '#2E7D32', offer: '#B71C1C' };

        function loadPromotions() {
            const container = document.getElementById('promotionsContainer');
            db.collection('promotions').where('active', '==', true).orderBy('createdAt', 'desc')
                .get()
                .then(snapshot => {
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="col-12"><div class="empty-state"><i class="bi bi-megaphone text-muted"></i><p>لا توجد عروض حالياً</p></div></div>';
                        return;
                    }
                    container.innerHTML = snapshot.docs.map(doc => {
                        const p = doc.data();
                        const imgs = p.images && p.images.length > 0 ? p.images : [];
                        const imgHtml = imgs.length > 0
                            ? `<div id="carousel-${doc.id}" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner">${imgs.map((u, i) => `<div class="carousel-item${i === 0 ? ' active' : ''}"><img src="${u}" class="promo-img" alt=""></div>`).join('')}</div>
                                ${imgs.length > 1 ? `<button class="carousel-control-prev" type="button" data-bs-target="#carousel-${doc.id}" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" type="button" data-bs-target="#carousel-${doc.id}" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>` : ''}
                              </div>`
                            : `<div style="height:200px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;"><i class="bi bi-megaphone" style="font-size:40px;color:#bbb;"></i></div>`;
                        const videoHtml = p.videoUrl ? `<a href="${p.videoUrl}" target="_blank" class="video-btn"><i class="bi bi-play-fill"></i> فيديو</a>` : '';
                        const descHtml = p.description ? `<p class="text-muted small mb-1" style="font-size:14px;">${p.description}</p>` : '';
                        return `<div class="col-md-4 col-sm-6">
                            <div class="promo-card position-relative">
                                <span class="type-badge badge" style="background:${typeColors[p.type] || '#6c757d'};color:white;">${typeLabels[p.type] || p.type}</span>
                                ${imgHtml}
                                <div class="p-3">
                                    <h6 class="fw-bold mb-1">${p.title}</h6>
                                    ${descHtml}
                                    ${videoHtml ? `<div class="mt-2">${videoHtml}</div>` : ''}
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(err => {
                    container.innerHTML = `<div class="col-12 text-center text-danger py-5">حدث خطأ: ${err.message}</div>`;
                });
        }

        loadPromotions();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
